name: Release Obsidian plugin

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e 'const manifest = require("./manifest.json"); const pkg = require("./package.json"); const versions = require("./versions.json"); const tag = process.env.RELEASE_TAG; if (tag !== manifest.version || tag !== pkg.version || versions[tag] !== manifest.minAppVersion) { console.error("Tag, package.json, manifest.json and versions.json must agree."); process.exit(1); }'

      - name: Install dependencies and build
        run: |
          npm ci
          npm run typecheck
          npm run build

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --draft \
            main.js manifest.json styles.css
